  test-integration:
    name: Test (integration, Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: gp
          POSTGRES_DB: gatepass
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:gp@localhost:5432/gatepass
      SUPABASE_URL: ""
      JWT_SECRET: ci-integration-only-not-a-secret
      PIN_PEPPER: ci-integration-only-not-a-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build database from drizzle/*.sql (LC_ALL=C order, one transaction per file, RLS on every table)
        run: scripts/build-db-from-sql.sh "$DATABASE_URL"
      - run: npx vitest run --config vitest.integration.config.ts
